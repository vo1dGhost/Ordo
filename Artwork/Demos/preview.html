<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Ordo 动画预览</title>
<style>html,body{margin:0;background:#0c0a09}body{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:center;min-height:100vh}div{aspect-ratio:16/9}svg,img{width:100%;height:100%;display:block}</style>
<div data-kind="move" aria-label="自由移动"></div><div data-kind="resize" aria-label="调整大小"></div><div data-kind="snap" aria-label="八向排布"></div>
<script type="module">
import {svg} from './demo-scene.mjs';
const start=performance.now(), elements=[...document.querySelectorAll('[data-kind]')];
function animate(now){for(const el of elements)el.innerHTML=svg(el.dataset.kind,(now-start)/1000);requestAnimationFrame(animate)}
if(new URLSearchParams(location.search).get('format')==='apng'){
  for(const el of elements){const img=document.createElement('img');img.src=`./${el.dataset.kind}.apng`;img.alt=el.getAttribute('aria-label');el.append(img)}
}else requestAnimationFrame(animate);
</script></html>
